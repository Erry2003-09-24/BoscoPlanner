name: Flutter Continuous Integration

on:
  push:
    branches: [ programmazione_mobile-2025 ]
  pull_request:
    branches: [ programmazione_mobile-2025 ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v3

    - name: Install Flutter
      uses: subosito/flutter-action@v2
      with:
        flutter-version: '3.29.3'

    - name: Flutter pub get
      run: flutter pub get
    
    - name: Build APK
      run: flutter build apk --debug

    - name: Create config.dart with API key
      run: |
        echo "const String apiKey = '${{ secrets.API_KEY }}';" > lib/config.dart
