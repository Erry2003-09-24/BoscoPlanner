name: Flutter CI

on:
  push:
    branches: [ programmazione_mobile-2025 ]
  pull_request:
    branches: [ programmazione_mobile-2025 ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v3

    - name: Install Flutter
      uses: subosito/flutter-action@v2
      with:
        flutter-version: '3.29.3'

    - name: Flutter pub get
      run: flutter pub get

    - name: Flutter analyze
      run: flutter analyze
